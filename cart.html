<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Корзина — PLASTEK</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="cart" data-subnav="off">

  <section class="page-head">
    <div class="wrap">
      <div class="crumbs"><a href="index.html">Главная</a> / Корзина</div>
      <h1 class="h2">Корзина</h1>
    </div>
  </section>

  <div class="wrap" id="root" data-catalog><div class="loading">Загружаем корзину…</div></div>

  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/app.js"></script>
  <script>
    const { $, money, esc, spool, fmtD, unitPrice, stockLabel, Cart, Account, toast, payConfig } = App;
    const COUNTRIES = SITE.countries;
    const [T1, T2] = SITE.tiers;
    let form = {};   // сохраняем введённое при перерисовке
    // покупатель вернулся со страницы Stripe, не заплатив
    const canceled = new URLSearchParams(location.search).get("canceled") === "1";

    Promise.all([App.ready, payConfig()]).then(([{ bySku }, pc]) => {
      function render() {
        const items = Cart.read().map(i => ({ ...i, v: bySku.get(i.sku) })).filter(i => i.v);
        if (!items.length) {
          $("#root").innerHTML = `<div class="empty" style="margin:44px 0 100px">В корзине пока пусто.<br><br><a class="btn" href="catalog.html">Перейти в каталог</a></div>`;
          return;
        }
        const u0 = Account.user() || {};
        const country = form.country || u0.country || COUNTRIES[0];
        const cardOk = pc.cardCountries.includes(country);
        const ship = pc.mode === "checkout" && cardOk ? pc.shipping[country] : null;
        const pay = cardOk ? (form.pay || "online") : "invoice";
        const total = items.reduce((s, i) => s + i.qty, 0);
        const sum = items.reduce((s, i) => s + unitPrice(i.v, total) * i.qty, 0);
        const retail = items.reduce((s, i) => s + i.v.price * i.qty, 0);
        const tierName = total >= T2 ? `оптовая, от ${T2} шт.` : total >= T1 ? `оптовая, от ${T1} шт.` : "розничная";
        const next = total < T1 ? T1 - total : total < T2 ? T2 - total : 0;
        const u = Account.user() || {};
        const val = (k, d = "") => esc(form[k] ?? u[k] ?? d);

        $("#root").innerHTML = `
        ${canceled ? `<div class="banner">Оплата не завершена — товары остались в корзине. Можно попробовать ещё раз или выбрать банковский перевод.</div>` : ""}
        <div class="cart">
          <div>
            ${items.map(({ v, qty }) => {
              const price = unitPrice(v, total);
              return `<div class="cart-item">
                <a class="cart-item__img" href="product.html?id=${v.product.id}&sku=${encodeURIComponent(v.sku)}">${spool(v.hex)}</a>
                <div>
                  <a class="card__title" href="product.html?id=${v.product.id}&sku=${encodeURIComponent(v.sku)}">${esc(v.product.name)}, ${esc(v.color.toLowerCase())}</a>
                  <div class="card__spec">${fmtD(v.d)} мм · ${fmtD(v.w)} кг · ${money(price)}/шт. ${price < v.price ? `<s>${money(v.price)}</s>` : ""}</div>
                  ${v.stock < qty ? `<div style="font-size:13px;margin-top:2px">${v.stock > 0 ? `В наличии ${v.stock} шт., остальное — под заказ` : stockLabel(0)}</div>` : ""}
                  <button class="remove" data-rm="${esc(v.sku)}">Удалить</button>
                </div>
                <div class="qty">
                  <button data-dec="${esc(v.sku)}" aria-label="Меньше">−</button>
                  <input value="${qty}" data-qty="${esc(v.sku)}" aria-label="Количество">
                  <button data-inc="${esc(v.sku)}" aria-label="Больше">+</button>
                </div>
                <div class="price">${money(price * qty)}</div>
              </div>`;
            }).join("")}
          </div>

          <aside class="summary">
            <h3 class="h3">Ваш заказ</h3>
            <div class="summary__row"><span class="muted">Катушек</span><span>${total} шт.</span></div>
            <div class="summary__row"><span class="muted">Цена</span><span>${tierName}</span></div>
            ${sum < retail ? `<div class="summary__row"><span class="muted">Экономия</span><span>${money(retail - sum)}</span></div>` : ""}
            <div class="summary__row"><span class="muted">Доставка</span><span>${ship ? `${money(ship.amount)} · ${esc(ship.days)}` : "по тарифу службы"}</span></div>
            <div class="summary__row summary__total"><span>Итого</span><span>${money(sum + (ship ? ship.amount : 0))}</span></div>
            ${ship ? "" : `<p class="muted" style="font-size:13px">Без доставки — её стоимость сообщим до оплаты.</p>`}
            ${next ? `<div class="tier-note">Добавьте ещё ${next} шт. — цена за катушку станет ниже. <a class="link" href="opt.html">Оптовые цены</a></div>` : ""}

            <form class="form" id="checkout">
              <h4>Получатель</h4>
              <input class="field" name="name" required placeholder="Имя и фамилия" value="${val("name")}">
              <input class="field" name="phone" type="tel" required placeholder="Телефон" value="${val("phone")}">
              <input class="field" name="email" type="email" required placeholder="E-mail — пришлём чек и трек-номер" value="${val("email")}">

              <h4>Доставка</h4>
              <select class="field" name="country" aria-label="Страна">${COUNTRIES.map(c => `<option ${country === c ? "selected" : ""}>${c}</option>`).join("")}</select>
              <input class="field" name="city" required placeholder="Город" value="${val("city")}">
              <div class="radio-list">
                ${[["cdek-pvz", "Пункт выдачи СДЭК", "Во всех странах доставки"], ["courier", "Курьер до двери", "Служба и цена — по договорённости"]]
                  .map(([k, t, s], i) => `<label class="radio"><input type="radio" name="delivery" value="${k}" ${(form.delivery || "cdek-pvz") === k ? "checked" : ""}><div><b>${t}</b><span>${s}</span></div></label>`).join("")}
              </div>
              <input class="field" name="address" required placeholder="Адрес или пункт выдачи" value="${val("address")}">

              <h4>Оплата</h4>
              <div class="radio-list">
                <label class="radio ${cardOk ? "" : "is-disabled"}"><input type="radio" name="pay" value="online" ${pay === "online" ? "checked" : ""} ${cardOk ? "" : "disabled"}><div><b>Картой онлайн</b><span>Visa, Mastercard, Apple Pay, Google Pay</span></div></label>
                <label class="radio"><input type="radio" name="pay" value="invoice" ${pay === "invoice" ? "checked" : ""}><div><b>Банковский перевод</b><span>По счёту в долларах</span></div></label>
              </div>
              <p class="pay-note">${!cardOk
                ? `Для страны «${esc(country)}» оплата картой недоступна — пришлём счёт для банковского перевода.`
                : pc.mode === "checkout"
                  ? `После оформления откроется защищённая страница оплаты ${esc(SITE.payProvider)}.`
                  : `Посчитаем доставку и пришлём на почту ссылку на оплату картой через ${esc(SITE.payProvider)}.`}</p>
              <div id="company" style="display:${pay === "invoice" ? "grid" : "none"};gap:12px">
                <input class="field" name="company" placeholder="Название организации" value="${val("company")}">
                <input class="field" name="inn" placeholder="БИН / УНП / ИНН компании" value="${val("inn")}">
              </div>
              <textarea class="field" name="comment" rows="2" placeholder="Комментарий к заказу">${val("comment")}</textarea>
              <label class="check consent"><input type="checkbox" required> Согласен с <a href="offer.html" target="_blank">офертой</a> и <a href="privacy.html" target="_blank">обработкой персональных данных</a></label>
              <button class="btn btn--block">Оформить заказ</button>
            </form>
          </aside>
        </div>`;
      }

      const root = $("#root");
      const keep = () => { const f = $("#checkout"); if (f) form = Object.fromEntries(new FormData(f)); };
      root.addEventListener("click", e => {
        const t = e.target, items = Cart.read();
        const get = sku => (items.find(i => i.sku === sku) || {}).qty || 1;
        if (t.dataset.rm) Cart.remove(t.dataset.rm);
        else if (t.dataset.inc) Cart.set(t.dataset.inc, get(t.dataset.inc) + 1);
        else if (t.dataset.dec) Cart.set(t.dataset.dec, get(t.dataset.dec) - 1);
        else return;
        keep(); render();
      });
      root.addEventListener("change", e => {
        if (e.target.dataset.qty) { Cart.set(e.target.dataset.qty, parseInt(e.target.value) || 1); keep(); render(); }
        if (e.target.name === "pay") $("#company").style.display = e.target.value === "invoice" ? "grid" : "none";
        // от страны зависят доступность оплаты картой и цена доставки
        if (e.target.name === "country") { keep(); render(); }
      });
      root.addEventListener("submit", async e => {
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        if (!pc.cardCountries.includes(data.country)) data.pay = "invoice";
        const cart = Cart.read();
        const total = cart.reduce((s, i) => s + i.qty, 0);
        const lines = cart.map(i => { const v = bySku.get(i.sku); return v && { sku: v.sku, name: `${v.product.name}, ${v.color.toLowerCase()}`, qty: i.qty, price: unitPrice(v, total) }; }).filter(Boolean);
        const order = {
          id: String(Date.now()).slice(-6),
          date: new Date().toLocaleDateString("ru-RU"),
          status: data.pay === "invoice" ? "Ждёт счёта" : "Ждёт оплаты",
          lines, sum: lines.reduce((s, l) => s + l.price * l.qty, 0), customer: data
        };
        const remember = () => {
          Account.addOrder(order);
          if (!Account.user()) Account.login({ name: data.name, email: data.email, phone: data.phone, country: data.country });
        };

        // Автоматическая оплата: сервер пересчитывает цены и создаёт страницу оплаты Stripe Checkout
        if (data.pay === "online" && pc.mode === "checkout") {
          const btn = e.target.querySelector("button.btn");
          btn.disabled = true; btn.textContent = "Открываем оплату…";
          try {
            const res = await fetch("/api/checkout", {
              method: "POST", headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ orderId: order.id, email: data.email, country: data.country, items: cart })
            });
            const out = await res.json();
            if (!res.ok || !out.url) throw new Error(out.error || "Не удалось открыть оплату");
            remember();
            location.href = out.url; // корзину очистим после успешной оплаты (pay-success.html)
            return;
          } catch (err) {
            btn.disabled = false; btn.textContent = "Оформить заказ";
            toast(err.message + ". Попробуйте ещё раз или выберите банковский перевод");
            return;
          }
        }

        // Режим «счёт от менеджера»
        // TODO: отправить заказ на сервер (почта / Telegram / CRM)
        remember();
        Cart.clear();
        root.innerHTML = `<div class="empty" style="margin:44px 0 100px">
          <h2 class="h2" style="color:var(--text)">Заказ № ${order.id} принят</h2>
          <p style="margin:12px 0 24px">${data.pay === "invoice" ? "Посчитаем доставку и пришлём счёт на почту." : `Посчитаем доставку и пришлём на почту ссылку на оплату картой через ${esc(SITE.payProvider)}.`}</p>
          <a class="btn" href="account.html">Мои заказы</a>
        </div>`;
      });
      render();
    });
  </script>
</body>
</html>

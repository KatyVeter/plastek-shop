<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оплата — PLASTEK</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=all-colors-wheel-11">
</head>
<body data-page="pay" data-subnav="off">

  <!-- Сюда Stripe возвращает покупателя после оплаты: pay-success.html?order=…&session_id=… -->
  <div class="wrap page" id="root"><div class="loading">Проверяем оплату…</div></div>

  <script src="js/app.js?v=all-colors-wheel-11"></script>
  <script>
    const { $, money, esc, Cart, Account, store } = App;
    const p = new URLSearchParams(location.search);
    const orderId = p.get("order") || "", session = p.get("session_id") || "";

    const show = (title, text, ok) => {
      $("#root").innerHTML = `<div class="empty" style="margin:44px 0 60px">
        <h1 class="h2" style="color:var(--text)">${title}</h1>
        <p style="margin:12px 0 24px">${text}</p>
        <a class="btn" href="${ok ? "account.html" : "cart.html"}">${ok ? "Мои заказы" : "Вернуться в корзину"}</a>
      </div>`;
    };

    fetch(`/api/checkout-status?session_id=${encodeURIComponent(session)}`)
      .then(r => r.json())
      .then(s => {
        if (!s.paid) return show("Оплата не подтверждена", "Если деньги списались, напишите нам — проверим вручную.", false);
        // отмечаем заказ оплаченным в истории и очищаем корзину
        const orders = Account.orders().map(o => o.id === (s.orderId || orderId) ? { ...o, status: "Оплачен" } : o);
        store.set("plastek-orders", orders);
        Cart.clear();
        show(`Заказ № ${esc(s.orderId || orderId)} оплачен`, `Сумма ${money(s.amount)}. Отправим за 1–2 рабочих дня, трек-номер придёт на почту.`, true);
      })
      .catch(() => show("Не удалось проверить оплату", "Обновите страницу через минуту. Если вопрос останется — напишите нам.", false));
  </script>
</body>
</html>
